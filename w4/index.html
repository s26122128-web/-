<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朋友對我的動態留言板</title>
  
  <style>
    /* =========================================================
       1. 全局風格與變數設定 (賽博朋克霓虹暗黑風)
       ========================================================= */
    :root {
      /* 背景主色調：深邃暗黑 */
      --bg-color: #0d0f17;
      /* 卡片背景色 */
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      /* 主要文字顏色 */
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      
      /* 焦點 Highlight 特效顏色 (霓虹螢光藍與青色) */
      --highlight-color: #00f3ff;
      --highlight-glow: rgba(0, 243, 255, 0.6);
      --highlight-bg: rgba(0, 243, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      margin-bottom: 2rem;
      text-align: center;
    }

    header h1 {
      font-size: 2rem;
      letter-spacing: 2px;
      color: var(--highlight-color);
      text-shadow: 0 0 10px var(--highlight-glow);
    }

    /* =========================================================
       2. 酷炫 Loading 讀取動畫
       ========================================================= */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 5rem;
    }

    /* 旋轉霓虹光圈 */
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-left-color: var(--highlight-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      box-shadow: 0 0 15px var(--highlight-glow);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      margin-top: 1rem;
      font-size: 1.1rem;
      color: var(--highlight-color);
      letter-spacing: 1px;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* =========================================================
       3. 瀑布流牆 (Masonry Layout)
       ========================================================= */
    .masonry-wall {
      width: 100%;
      max-width: 1200px;
      
      /* 核心：使用 column-count 實現瀑布流 */
      column-count: 3; 
      column-gap: 1.5rem;
      
      /* 隱藏預設，載入完成後由 JS 改為 block */
      display: none; 
    }

    /* 響應式調整：小螢幕自動減少欄數 */
    @media (max-width: 900px) {
      .masonry-wall { column-count: 2; }
    }
    @media (max-width: 600px) {
      .masonry-wall { column-count: 1; }
    }

    /* =========================================================
       4. 留言卡片與輪播動畫
       ========================================================= */
    .card {
      /* 防止卡片內部跨欄斷開 */
      break-inside: avoid;
      margin-bottom: 1.5rem;
      
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.25rem;
      backdrop-filter: blur(5px);
      
      /* 平滑過渡動畫 (輪播變亮/變暗的關鍵) */
      transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      position: relative;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 0.5rem;
    }

    .card-name {
      font-weight: bold;
      font-size: 1.1rem;
      color: var(--text-main);
    }

    .card-time {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .card-content {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #cbd5e1;
      white-space: pre-wrap; /* 保留留言中的換行 */
    }

    /* --- 輪播狀態：被選中的卡片 (Highlight) --- */
    .card.active {
      transform: scale(1.05); /* 放大卡片 */
      border-color: var(--highlight-color);
      background-color: var(--highlight-bg);
      box-shadow: 0 0 25px var(--highlight-glow);
      z-index: 10;
      opacity: 1;
      filter: blur(0px);
    }

    /* --- 輪播狀態：沒被選中的卡片 (Dimmed) --- */
    .card.dimmed {
      opacity: 0.4;         /* 降低透明度 */
      filter: blur(1.5px);  /* 稍微模糊 */
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <header>
    <h1>💬 朋友的悄悄話留言牆</h1>
  </header>

  <!-- 讀取動畫 -->
  <div id="loading">
    <div class="spinner"></div>
    <div class="loading-text">讀取留言中...</div>
  </div>

  <!-- 留言瀑布流牆 -->
  <div id="wall" class="masonry-wall"></div>

  <script>
    /* =========================================================
       設定區塊 (已帶入您的 CSV 網址與設定輪播秒數)
       ========================================================= */
    // 已更新為您提供的 Google 試算表 CSV 網址：
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRP1yQhCZ1SXaV6mdLNgmL0KrahERE8J_yejnhcUY1asQiuXMEsvEe5czylsz4zDPvK-G4LoOSj7zR_/pub?output=csv'; 
    
    // 設定輪播間隔時間 (單位：毫秒，3000 表示 3 秒，可自行修改)
    const ROTATION_INTERVAL_MS = 3000; 

    /* =========================================================
       全域變數與 DOM 元素
       ========================================================= */
    const loadingEl = document.getElementById('loading');
    const wallEl = document.getElementById('wall');
    let cards = []; // 存放所有生成的 DOM 卡片
    let currentIndex = 0; // 當前輪播焦點的索引
    let timer = null; // setInterval 計時器

    /* =========================================================
       CSV 解析器 (正確處理包含雙引號與逗號的留言)
       ========================================================= */
    function parseCSV(text) {
      const lines = text.trim().split(/\r\n|\n/);
      const result = [];

      lines.forEach((line, index) => {
        // 跳過 CSV 的標題列 (Header)
        if (index === 0) return; 

        const row = [];
        let insideQuotes = false;
        let entry = '';

        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"') {
            insideQuotes = !insideQuotes; // 切換雙引號狀態
          } else if (char === ',' && !insideQuotes) {
            row.push(entry.trim());
            entry = '';
          } else {
            entry += char;
          }
        }
        row.push(entry.trim());

        // 清理單個欄位開頭與結尾的引號
        const cleanRow = row.map(col => col.replace(/^"|"$/g, '').replace(/""/g, '"'));

        // 預設欄位：[0]時間戳記, [1]名字, [2]悄悄話
        if (cleanRow.length >= 3) {
          result.push({
            time: cleanRow[0],
            name: cleanRow[1],
            content: cleanRow[2]
          });
        }
      });

      return result;
    }

    /* =========================================================
       動態生成留言卡片
       ========================================================= */
    function renderCards(data) {
      if (data.length === 0) {
        wallEl.innerHTML = '<p style="text-align:center; color: var(--text-muted);">目前還沒有任何留言喔！</p>';
        return;
      }

      wallEl.innerHTML = ''; // 清空牆面
      cards = []; // 重置卡片陣列

      data.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'card';

        // 格式化時間 (只顯示年月日時分)
        let formattedTime = item.time;
        try {
          const d = new Date(item.time);
          if (!isNaN(d)) {
            formattedTime = `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
          }
        } catch(e) {}

        card.innerHTML = `
          <div class="card-header">
            <span class="card-name">${escapeHTML(item.name)}</span>
            <span class="card-time">${escapeHTML(formattedTime)}</span>
          </div>
          <div class="card-content">${escapeHTML(item.content)}</div>
        `;

        wallEl.appendChild(card);
        cards.push(card);
      });
    }

    // 防範 XSS 攻擊的字串轉義函式
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    /* =========================================================
       隨時間輪播亮起特效 (Highlight Cycle)
       ========================================================= */
    function startHighlightCycle() {
      if (cards.length === 0) return;

      // 立即執行第一次亮起
      updateHighlight();

      // 設定計時器，依序輪播
      timer = setInterval(() => {
        currentIndex = (currentIndex + 1) % cards.length;
        updateHighlight();
      }, ROTATION_INTERVAL_MS);
    }

    function updateHighlight() {
      cards.forEach((card, index) => {
        if (index === currentIndex) {
          card.classList.add('active');
          card.classList.remove('dimmed');
        } else {
          card.classList.remove('active');
          card.classList.add('dimmed');
        }
      });
    }

    /* =========================================================
       資料讀取 (fetch CSV)
       ========================================================= */
    async function fetchMessages() {
      try {
        const response = await fetch(CSV_URL);
        if (!response.ok) throw new Error('網路回應錯誤');
        
        const csvText = await response.text();
        const data = parseCSV(csvText);

        // 關閉 Loading 動畫，顯示瀑布流牆
        loadingEl.style.display = 'none';
        wallEl.style.display = 'block';

        // 渲染卡片並啟動輪播
        renderCards(data);
        startHighlightCycle();

      } catch (error) {
        console.error('讀取 CSV 失敗:', error);
        loadingEl.innerHTML = `<div style="color: #ff4757;">⚠️ 載入留言失敗，請確認 Google 試算表是否已發布到網路並設為 CSV 格式。</div>`;
      }
    }

    // 頁面載入完成後自動執行
    document.addEventListener('DOMContentLoaded', fetchMessages);
  </script>
</body>
</html>
