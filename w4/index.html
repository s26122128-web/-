<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 引入 Google Fonts 日系與復古明體風格字型 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    /* =========================================================
       1. 全局風格與變數設定 (日式復古調色盤)
       改顏色請在這裡調整：
       ========================================================= */
    :root {
      /* 底色：溫暖的生成色 / 和紙米白 */
      --bg-color: #f6f3e7;
      /* 榻榻米與傳統和風墨色 */
      --card-bg: #fffcf5;
      --card-border: #d4c5ab;
      --text-main: #2b2b2b;       /* 濃墨色 */
      --text-muted: #8c7f6b;      /* 苔綠/古木色 */
      
      /* 焦點 Highlight 特效顏色 (日式硃砂紅 / 緋紅緋色) */
      --highlight-color: #c0392b; /* 硃砂紅 */
      --highlight-glow: rgba(192, 57, 43, 0.25);
      --highlight-bg: #ffffff;
      --stamp-color: #b33939;     /* 復古朱印色 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

      background-color: var(--bg-color);
      /* 和紙微紋理背景 */
      background-image: radial-gradient(#e2d7c3 1px, transparent 1px);
      background-size: 20px 20px;
